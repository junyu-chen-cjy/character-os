<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; base-uri 'none'; form-action 'none'">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Character OS</title>
  <link rel="stylesheet" href="./ui-tokens.css">
  <link rel="stylesheet" href="./chat.css">
  <script src="./ui-platform.js"></script>
  <script src="./chat-renderer.js" defer></script>
</head>
<body>
  <div class="cmd" id="cmd" data-view="chat">
    <form id="composer" class="bar">
      <span class="mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="8.2"></circle><circle cx="14.4" cy="10.2" r="2.1" fill="currentColor" stroke="none"></circle></svg>
      </span>
      <textarea id="message" rows="1" maxlength="32000" spellcheck="false"></textarea>
      <span id="chat-status" class="sr" role="status"></span>
      <div class="trail">
        <button type="button" id="stop" class="round stop" hidden>
          <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="7" y="7" width="10" height="10" rx="2"></rect></svg>
        </button>
        <button type="submit" id="send" class="round send" disabled>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5"></path><path d="m5 12 7-7 7 7"></path></svg>
        </button>
        <button type="button" id="more" class="ghost" aria-expanded="false" aria-controls="tools">
          <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="5.5" cy="12" r="1.6"></circle><circle cx="12" cy="12" r="1.6"></circle><circle cx="18.5" cy="12" r="1.6"></circle></svg>
        </button>
      </div>
    </form>

    <div id="setup" class="setup" hidden>
      <span id="setup-message"></span>
      <button type="button" id="configure" class="link"></button>
    </div>

    <div class="body" id="viewport">
      <div class="transcript" id="transcript" aria-label="Messages"></div>
      <p class="error" id="chat-error" role="alert" hidden></p>
    </div>

    <nav id="history" class="history" hidden aria-label="History">
      <div class="section-label" id="drawer-title">Recent</div>
      <div id="sessions" class="sessions"></div>
    </nav>

    <form id="model-form" class="sheet" hidden>
      <label><span id="lbl-base-url">Base URL</span>
        <input id="base-url" type="url" placeholder="https://api.openai.com/v1" maxlength="2048" required spellcheck="false" autocomplete="off">
      </label>
      <label><span id="lbl-model-id">Model ID</span>
        <input id="model-id" placeholder="gpt-4.1-mini" maxlength="512" required spellcheck="false" autocomplete="off">
      </label>
      <label><span id="lbl-api-key">API Key</span>
        <input id="api-key" type="password" maxlength="4096" autocomplete="off" spellcheck="false">
      </label>
      <p class="hint" id="key-hint"></p>
      <label class="check" id="clear-key-row" hidden>
        <input id="clear-key" type="checkbox">
        <span id="lbl-clear-key">Remove saved key</span>
      </label>
      <label><span id="lbl-system-prompt">System Prompt</span>
        <textarea id="system-prompt" rows="3" maxlength="16000"></textarea>
      </label>
      <p class="error" id="settings-error" role="alert" hidden></p>
      <footer class="sheet-actions">
        <button type="button" id="cancel-settings" class="ui-btn quiet">Cancel</button>
        <button type="submit" id="save-model" class="ui-btn primary">Save</button>
      </footer>
    </form>

    <div id="tools" class="tools" hidden>
      <button type="button" id="new-chat" class="tool"><span id="new-chat-label">New</span><kbd class="ui-kbd">⌘N</kbd></button>
      <button type="button" id="toggle-history" class="tool"><span id="history-label">History</span></button>
      <button type="button" id="model-settings" class="tool"><span id="model-label">Model</span></button>
    </div>
  </div>
</body>
</html>
