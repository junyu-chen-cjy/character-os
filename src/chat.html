<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; base-uri 'none'; form-action 'none'">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Character OS Chat</title>
  <link rel="stylesheet" href="./chat.css">
  <script src="./chat-renderer.js" defer></script>
</head>
<body>
  <aside class="sidebar">
    <div class="sidebar-heading">
      <span class="brand">Character OS</span>
      <button type="button" id="new-chat" class="new-chat">
        <span aria-hidden="true">+</span> New chat
      </button>
    </div>
    <nav id="sessions" class="sessions" aria-label="Chat history"></nav>
  </aside>
  <main class="conversation">
    <header class="topbar">
      <h1 id="title">Chat</h1>
      <button type="button" id="model-settings" class="model-button">Model settings</button>
    </header>

    <div class="viewport" id="viewport">
      <div class="transcript" id="transcript" aria-label="Messages"></div>
      <section id="empty" class="empty" hidden>
        <h2>What’s on your mind?</h2>
        <p id="setup-message">Choose a model to start chatting.</p>
        <button type="button" id="configure" class="secondary">Configure model</button>
      </section>
    </div>

    <form id="composer" class="composer">
      <div class="compose-box">
        <textarea id="message" rows="2" maxlength="32000" aria-label="Message" placeholder="Message your model…"></textarea>
        <div class="compose-actions">
          <span id="chat-status" role="status"></span>
          <button type="button" id="stop" class="secondary" hidden>Stop</button>
          <button type="submit" id="send" class="primary" disabled>Send</button>
        </div>
      </div>
      <p class="error" id="chat-error" role="alert" hidden></p>
    </form>
  </main>

  <dialog id="settings">
    <form id="model-form">
      <header class="settings-heading">
        <h2>Model settings</h2>
        <p>Connect to an OpenAI-compatible chat endpoint.</p>
      </header>
      <label>Base URL
        <input id="base-url" type="url" placeholder="https://provider.example/v1" maxlength="2048" required>
      </label>
      <label>Model ID
        <input id="model-id" placeholder="your-model-id" maxlength="512" required>
      </label>
      <label>API key
        <input id="api-key" type="password" placeholder="Optional for endpoints without authentication" maxlength="4096" autocomplete="off">
      </label>
      <p class="hint" id="key-hint">Keys are encrypted using your system’s secure storage.</p>
      <label class="toggle" id="clear-key-row" hidden>
        <input id="clear-key" type="checkbox"> Remove saved key
      </label>
      <label>System prompt
        <textarea id="system-prompt" rows="3" placeholder="Optional instructions for the model" maxlength="16000"></textarea>
      </label>
      <p class="error" id="settings-error" role="alert" hidden></p>
      <footer class="settings-actions">
        <button type="button" id="cancel-settings" class="secondary">Cancel</button>
        <button type="submit" id="save-model" class="primary">Save settings</button>
      </footer>
    </form>
  </dialog>
</body>
</html>
