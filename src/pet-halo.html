<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'self' 'unsafe-inline'; script-src 'self'; img-src 'self' data: file:;">
<title>Character OS</title>
<link rel="stylesheet" href="ui-tokens.css">
<style>
html, body { width: 100%; background: transparent; overflow: hidden; user-select: none; -webkit-user-select: none; }
body { padding: 2px 6px 8px; font-size: var(--fs-sm); }

.halo-shell {
  width: 100%;
  border-radius: var(--r-xl);
  background: var(--float);
  -webkit-backdrop-filter: blur(24px) saturate(160%);
  backdrop-filter: blur(24px) saturate(160%);
  box-shadow: var(--shadow-float);
  overflow: hidden;
  opacity: 0;
  transform: translateY(-3px) scale(0.988);
  transition: opacity 130ms var(--ease), transform 170ms var(--ease);
}
.halo-shell.flipped-above { transform: translateY(3px) scale(0.988); }
.halo-shell.is-visible { opacity: 1; transform: none; }

/* ── compact 5-row unified quotas ── */
.quotas { display: flex; flex-direction: column; padding: 3px 0; cursor: pointer; }
.q-row {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto 36px;
  align-items: center;
  gap: 8px;
  padding: 5px 11px;
  min-height: 27px;
  transition: background var(--dur-1) var(--ease);
}
.q-row + .q-row { border-top: 1px solid var(--line); }
.q-row:hover { background: var(--hover); }
.q-name {
  min-width: 0;
  font-size: var(--fs-sm);
  font-weight: 540;
  letter-spacing: -0.005em;
  color: var(--text);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.q-row.is-muted .q-name { color: var(--text-2); }
.q-slots {
  display: inline-flex;
  align-items: baseline;
  justify-content: flex-end;
  gap: 7px;
  font-size: var(--fs-xs);
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
}
.q-slot { display: inline-flex; align-items: baseline; gap: 3px; color: var(--text); }
.q-slot .k { color: var(--text-3); font-size: 10.5px; }
.q-slot .v { font-weight: 600; }
.q-slot.warn .v { color: var(--warn); }
.q-slot.bad .v { color: var(--bad); }
.q-slot.stale .v { color: var(--text-3); font-weight: 500; }
.q-slot.disabled .v { color: var(--text-3); font-weight: 450; }
.q-none { font-size: var(--fs-xs); color: var(--text-3); }

.q-bar {
  height: 3px;
  width: 36px;
  border-radius: 999px;
  background: var(--meter-track);
  overflow: hidden;
}
.q-bar i {
  display: block;
  height: 100%;
  border-radius: inherit;
  background: var(--meter);
  transition: width 200ms var(--ease);
}
.q-bar.warn i { background: var(--warn); }
.q-bar.bad i { background: var(--bad); }
.q-bar.empty { opacity: 0.32; }
.q-bar.empty i { width: 0; }

/* ── entries (3 quick actions) ── */
.dock { display: flex; gap: 2px; padding: 4px; border-top: 1px solid var(--line); }
.dock-btn {
  position: relative;
  appearance: none;
  flex: 1 1 auto;
  display: flex; align-items: center; justify-content: center; gap: 6px;
  height: 28px; padding: 0 8px;
  border: 0; border-radius: var(--r-md);
  background: transparent; color: var(--text-2);
  font-size: var(--fs-sm); font-weight: 520; white-space: nowrap;
  transition: background var(--dur-1) var(--ease), color var(--dur-1) var(--ease), transform 80ms var(--ease);
}
.dock-btn:hover { background: var(--hover); color: var(--text); }
.dock-btn:active { background: var(--press); transform: scale(0.97); }
.dock-btn:focus-visible { outline: none; box-shadow: var(--focus); }
.dock-btn img, .dock-btn svg { width: 14px; height: 14px; flex: none; }
.dock-btn img { border-radius: 3px; object-fit: contain; }
.dock-btn svg { stroke: currentColor; fill: none; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
.badge { position: absolute; top: 5px; left: 20px; width: 6px; height: 6px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 0 2px var(--float-solid); }
.badge.approval { background: var(--warn); }
[hidden] { display: none !important; }
</style>
</head>
<body>
  <div id="haloShell" class="halo-shell" role="region" aria-label="Character OS">
    <div id="quotaPanel" class="quotas"></div>
    <div class="dock" role="toolbar">
      <button id="btnCodex" class="dock-btn" type="button">
        <img id="icoCodex" alt="" hidden>
        <svg id="svgCodex" viewBox="0 0 24 24" aria-hidden="true"><polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/></svg>
        <span>Codex</span>
      </button>
      <button id="btnAntigravity" class="dock-btn" type="button">
        <img id="icoAntigravity" alt="" hidden>
        <svg id="svgAntigravity" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3 4 20h4.2l3.8-8.2L15.8 20H20L12 3Z"/></svg>
        <span>Antigravity</span>
      </button>
      <button id="btnWorkspace" class="dock-btn" type="button">
        <i id="workspaceBadge" class="badge" hidden></i>
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="3.5" width="7" height="7" rx="1.6"/><rect x="13.5" y="3.5" width="7" height="7" rx="1.6"/><rect x="3.5" y="13.5" width="7" height="7" rx="1.6"/><rect x="13.5" y="13.5" width="7" height="7" rx="1.6"/></svg>
        <span id="lblWorkspace">Workspace</span>
      </button>
    </div>
  </div>
  <script src="ui-platform.js"></script>
  <script src="quota-view-model.js"></script>
  <script src="pet-halo-renderer.js"></script>
</body>
</html>
