<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'self' 'unsafe-inline'; script-src 'self'; img-src 'self' data: file:;">
<title>Character OS Quick Bar</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  color-scheme: light dark;
  --surface: rgba(252, 252, 254, 0.96);
  --surface-hover: rgba(0, 0, 0, 0.06);
  --surface-active: rgba(0, 0, 0, 0.10);
  --border: rgba(0, 0, 0, 0.11);
  --divider: rgba(0, 0, 0, 0.08);
  --ink: #141417;
  --ink-secondary: #4a4a52;
  --ink-muted: #7c7c85;
  --accent: #0066cc;
  --ok: #1f9d55;
  --warn: #d97706;
  --hot: #dc2626;
  --track: rgba(0, 0, 0, 0.085);
  --codex: #7c5cff;
  --antigravity: #0ea5e9;
  --shadow: 0 8px 22px rgba(0, 0, 0, 0.16), 0 1px 4px rgba(0, 0, 0, 0.08);
}

@media (prefers-color-scheme: dark) {
  :root {
    --surface: rgba(28, 28, 32, 0.96);
    --surface-hover: rgba(255, 255, 255, 0.09);
    --surface-active: rgba(255, 255, 255, 0.14);
    --border: rgba(255, 255, 255, 0.14);
    --divider: rgba(255, 255, 255, 0.095);
    --ink: #f5f5f7;
    --ink-secondary: #b6b6bf;
    --ink-muted: #84848e;
    --accent: #4da3ff;
    --ok: #34d399;
    --warn: #fbbf24;
    --hot: #f87171;
    --track: rgba(255, 255, 255, 0.12);
    --codex: #a78bfa;
    --antigravity: #38bdf8;
    --shadow: 0 10px 26px rgba(0, 0, 0, 0.50), 0 1px 4px rgba(0, 0, 0, 0.30);
  }
}

html, body {
  width: 100%;
  background: transparent;
  overflow: hidden;
  user-select: none;
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "Segoe UI", system-ui, sans-serif;
  font-size: 12px;
  color: var(--ink);
  -webkit-font-smoothing: antialiased;
}

body {
  padding: 5px 7px 9px;
}

.halo-shell {
  width: 100%;
  border-radius: 12px;
  background: var(--surface);
  backdrop-filter: blur(16px) saturate(140%);
  -webkit-backdrop-filter: blur(16px) saturate(140%);
  border: 1px solid var(--border);
  box-shadow: var(--shadow);
  overflow: hidden;
  opacity: 0;
  transform: translateY(-3px) scale(0.98);
  transition: opacity 130ms cubic-bezier(0.22, 1, 0.36, 1),
              transform 150ms cubic-bezier(0.22, 1, 0.36, 1);
}

.halo-shell.flipped-above {
  transform: translateY(3px) scale(0.98);
}

.halo-shell.is-visible {
  opacity: 1;
  transform: translateY(0) scale(1);
}

/* ── Compact Quota Strip ── */
.quota-panel {
  padding: 7px 9px 6px;
  border-bottom: 1px solid var(--divider);
  display: flex;
  flex-direction: column;
  gap: 5px;
  cursor: pointer;
}

.quota-panel:hover {
  background: var(--surface-hover);
}

.quota-row {
  display: flex;
  flex-direction: column;
  gap: 3px;
}

.quota-row-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 6px;
  min-width: 0;
}

.quota-service {
  display: flex;
  align-items: center;
  gap: 5px;
  min-width: 0;
}

.quota-icon {
  width: 12px;
  height: 12px;
  border-radius: 3px;
  object-fit: contain;
  flex-shrink: 0;
}

.quota-name {
  font-size: 11px;
  font-weight: 600;
  color: var(--ink);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.quota-readout {
  display: flex;
  align-items: baseline;
  gap: 4px;
  flex-shrink: 0;
  font-variant-numeric: tabular-nums;
}

.quota-pct {
  font-size: 11px;
  font-weight: 600;
  color: var(--ink);
}

.quota-pct.sev-warn { color: var(--warn); }
.quota-pct.sev-hot { color: var(--hot); }

.quota-meta,
.quota-none {
  font-size: 10px;
  color: var(--ink-muted);
  white-space: nowrap;
}

.quota-bar {
  height: 3px;
  border-radius: 999px;
  background: var(--track);
  overflow: hidden;
}

.quota-bar-fill {
  height: 100%;
  border-radius: 999px;
  transition: width 160ms ease;
}

.quota-bar-fill.pv-codex { background: var(--codex); }
.quota-bar-fill.pv-antigravity { background: var(--antigravity); }
.quota-bar-fill.sev-warn { background: var(--warn); }
.quota-bar-fill.sev-hot { background: var(--hot); }

/* ── 4 Direct Quick Actions ── */
.dock-row {
  display: grid;
  grid-template-columns: 0.92fr 0.9fr 1.22fr 1.06fr;
  gap: 2px;
  padding: 4px 5px;
}

[hidden] { display: none !important; }

.dock-btn {
  position: relative;
  appearance: none;
  border: 0;
  background: transparent;
  color: var(--ink-secondary);
  border-radius: 8px;
  padding: 6px 2px 5px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 3px;
  cursor: pointer;
  font: inherit;
  transition: background 110ms ease, color 110ms ease, transform 90ms ease;
}

.dock-btn:hover {
  background: var(--surface-hover);
  color: var(--ink);
}

.dock-btn:active {
  background: var(--surface-active);
  transform: scale(0.96);
}

.dock-btn svg,
.dock-btn img {
  width: 14px;
  height: 14px;
  flex-shrink: 0;
}

.dock-btn img {
  border-radius: 3px;
  object-fit: contain;
}

.dock-label {
  font-size: 10px;
  font-weight: 550;
  line-height: 1.15;
  white-space: nowrap;
  max-width: 100%;
  overflow: hidden;
  text-overflow: ellipsis;
}

.dock-badge-dot {
  position: absolute;
  top: 4px;
  right: 9px;
  width: 5px;
  height: 5px;
  border-radius: 50%;
  background: var(--ok);
}

.dock-badge-dot.has-approval {
  background: var(--warn);
}

.dock-badge-dot[hidden] { display: none; }

@media (prefers-reduced-motion: reduce) {
  .halo-shell,
  .quota-bar-fill,
  .dock-btn {
    transition: none;
  }
}
</style>
</head>
<body>
  <div id="haloShell" class="halo-shell" role="region" aria-label="Character OS quick actions">
    <div id="quotaPanel" class="quota-panel"></div>
    <div class="dock-row" role="toolbar" aria-label="Quick actions">
      <button id="btnCommand" class="dock-btn" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="m7 9 4 3-4 3"></path>
          <path d="M13 15h4"></path>
          <rect x="3" y="4" width="18" height="16" rx="3"></rect>
        </svg>
        <span id="lblCommand" class="dock-label">Command</span>
      </button>

      <button id="btnCodex" class="dock-btn" type="button">
        <img id="icoCodex" alt="" hidden>
        <svg id="svgCodex" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <polyline points="16 18 22 12 16 6"></polyline>
          <polyline points="8 6 2 12 8 18"></polyline>
        </svg>
        <span class="dock-label">Codex</span>
      </button>

      <button id="btnAntigravity" class="dock-btn" type="button">
        <img id="icoAntigravity" alt="" hidden>
        <svg id="svgAntigravity" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M12 3 4 20h4.2l3.8-8.2L15.8 20H20L12 3Z"></path>
        </svg>
        <span class="dock-label">Antigravity</span>
      </button>

      <button id="btnWorkspace" class="dock-btn" type="button">
        <span id="workspaceBadge" class="dock-badge-dot" hidden></span>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect x="3.5" y="3.5" width="7" height="7" rx="1.6"></rect>
          <rect x="13.5" y="3.5" width="7" height="7" rx="1.6"></rect>
          <rect x="3.5" y="13.5" width="7" height="7" rx="1.6"></rect>
          <rect x="13.5" y="13.5" width="7" height="7" rx="1.6"></rect>
        </svg>
        <span id="lblWorkspace" class="dock-label">Workspace</span>
      </button>
    </div>
  </div>
  <script src="pet-halo-renderer.js"></script>
</body>
</html>
