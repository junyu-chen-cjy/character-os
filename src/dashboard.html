<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'self' 'unsafe-inline'; script-src 'self'; img-src 'self' data: file:">
<title>Character OS Workspace</title>
<link rel="stylesheet" href="language-picker.css">
<style>
* { box-sizing: border-box; }

:root {
  color-scheme: light dark;
  --bg: #f5f5f7;
  --sidebar-bg: #ebebf0;
  --sidebar-hover: rgba(0, 0, 0, 0.045);
  --sidebar-active: rgba(255, 255, 255, 0.92);
  --surface: #ffffff;
  --surface-alt: #efeff2;
  --surface-hover: rgba(0, 0, 0, 0.045);
  --text: #141417;
  --text-secondary: #52525b;
  --muted: #686870;
  --subtle: #8e8e96;
  --border: rgba(0, 0, 0, 0.08);
  --border-strong: rgba(0, 0, 0, 0.13);
  --row-border: rgba(0, 0, 0, 0.055);
  --accent: #0066cc;
  --accent-hover: #0055ad;
  --accent-soft: rgba(0, 102, 204, 0.10);
  --running: #16a34a;
  --running-soft: rgba(22, 163, 74, 0.11);
  --done: #0066cc;
  --done-soft: rgba(0, 102, 204, 0.10);
  --interrupted: #d97706;
  --interrupted-soft: rgba(217, 119, 6, 0.12);
  --idle: #8e8e96;
  --idle-soft: rgba(142, 142, 150, 0.12);
  --scroll-thumb: rgba(0, 0, 0, 0.14);
  --scroll-thumb-hover: rgba(0, 0, 0, 0.24);
  --card-shadow: 0 1px 2px rgba(0, 0, 0, 0.035);
}

@media (prefers-color-scheme: dark) {
  :root {
    --bg: #1c1c1f;
    --sidebar-bg: #161619;
    --sidebar-hover: rgba(255, 255, 255, 0.055);
    --sidebar-active: rgba(255, 255, 255, 0.10);
    --surface: #242428;
    --surface-alt: #2c2c32;
    --surface-hover: rgba(255, 255, 255, 0.065);
    --text: #f4f4f6;
    --text-secondary: #b4b4bc;
    --muted: #9c9ca6;
    --subtle: #71717a;
    --border: rgba(255, 255, 255, 0.085);
    --border-strong: rgba(255, 255, 255, 0.14);
    --row-border: rgba(255, 255, 255, 0.06);
    --accent: #3b93ff;
    --accent-hover: #57a3ff;
    --accent-soft: rgba(59, 147, 255, 0.16);
    --running: #34d399;
    --running-soft: rgba(52, 211, 153, 0.15);
    --done: #60a5fa;
    --done-soft: rgba(96, 165, 250, 0.15);
    --interrupted: #fbbf24;
    --interrupted-soft: rgba(251, 191, 36, 0.16);
    --idle: #a1a1aa;
    --idle-soft: rgba(161, 161, 170, 0.16);
    --scroll-thumb: rgba(255, 255, 255, 0.14);
    --scroll-thumb-hover: rgba(255, 255, 255, 0.24);
    --card-shadow: 0 1px 3px rgba(0, 0, 0, 0.22);
  }
}

html, body {
  margin: 0;
  height: 100%;
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", "PingFang SC", "Microsoft YaHei", Roboto, sans-serif;
  font-size: 13px;
  -webkit-font-smoothing: antialiased;
  user-select: none;
  overflow: hidden;
}

.app {
  display: grid;
  grid-template-columns: 184px minmax(0, 1fr);
  height: 100%;
  width: 100%;
}

/* ── Left Sidebar ── */
.ws-sidebar {
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  background: var(--sidebar-bg);
  border-right: 1px solid var(--border);
  padding: 16px 10px 12px;
  min-height: 0;
  overflow-y: auto;
}

.ws-sidebar-top {
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.title-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 6px;
  padding: 0 8px;
}

.title-row-left {
  display: flex;
  align-items: center;
  gap: 7px;
  min-width: 0;
}

.brand-mark {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--subtle);
  flex-shrink: 0;
}

.brand-mark.is-running { background: var(--running); }
.brand-mark.has-approval { background: var(--interrupted); }

h1 {
  margin: 0;
  font-size: 14px;
  font-weight: 650;
  letter-spacing: -0.01em;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.count {
  font-size: 10.5px;
  font-weight: 600;
  color: var(--muted);
  background: var(--surface-alt);
  padding: 1px 6px;
  border-radius: 999px;
  font-variant-numeric: tabular-nums;
  flex-shrink: 0;
}

.ws-nav {
  display: flex;
  flex-direction: column;
  gap: 2px;
}

.ws-nav-btn {
  appearance: none;
  border: 0;
  background: transparent;
  color: var(--text-secondary);
  font: inherit;
  font-size: 12.5px;
  font-weight: 500;
  padding: 7px 10px;
  border-radius: 8px;
  display: flex;
  align-items: center;
  gap: 9px;
  cursor: pointer;
  text-align: left;
  transition: background 120ms ease, color 120ms ease;
}

.ws-nav-btn:hover {
  background: var(--sidebar-hover);
  color: var(--text);
}

.ws-nav-btn.is-active {
  background: var(--sidebar-active);
  color: var(--text);
  font-weight: 600;
  box-shadow: 0 1px 2px rgba(0, 0, 0, 0.06);
}

.ws-nav-btn svg {
  width: 15px;
  height: 15px;
  flex-shrink: 0;
  opacity: 0.8;
}

.ws-nav-btn.is-active svg {
  color: var(--accent);
  opacity: 1;
}

.ws-sidebar-footer {
  display: flex;
  flex-direction: column;
  gap: 2px;
  padding-top: 10px;
  border-top: 1px solid var(--border);
}

.ws-side-action {
  appearance: none;
  border: 0;
  background: transparent;
  color: var(--text-secondary);
  font: inherit;
  font-size: 12px;
  font-weight: 500;
  padding: 6px 10px;
  border-radius: 7px;
  display: flex;
  align-items: center;
  gap: 8px;
  cursor: pointer;
  text-align: left;
  transition: background 110ms ease, color 110ms ease;
}

.ws-side-action:hover {
  background: var(--sidebar-hover);
  color: var(--text);
}

.ws-side-action svg {
  width: 14px;
  height: 14px;
  flex-shrink: 0;
  opacity: 0.78;
}

/* ── Right Main Workspace ── */
.ws-main {
  display: flex;
  flex-direction: column;
  min-width: 0;
  min-height: 0;
  background: var(--bg);
}

.quick-banner {
  margin: 12px 24px 0;
  padding: 7px 12px;
  border-radius: 8px;
  border: 1px solid var(--border);
  background: var(--surface);
  color: var(--muted);
  font-size: 12px;
  line-height: 1.4;
}

.quick-banner.is-active {
  border-color: var(--accent);
  background: var(--accent-soft);
  color: var(--text);
}

.quick-banner[hidden] { display: none; }

.ws-scroll {
  flex: 1 1 auto;
  min-height: 0;
  overflow-y: auto;
  padding: 20px 26px 28px;
  display: flex;
  flex-direction: column;
  gap: 18px;
}

.ws-scroll::-webkit-scrollbar { width: 6px; }
.ws-scroll::-webkit-scrollbar-track { background: transparent; }
.ws-scroll::-webkit-scrollbar-thumb { background: var(--scroll-thumb); border-radius: 3px; }
.ws-scroll::-webkit-scrollbar-thumb:hover { background: var(--scroll-thumb-hover); }

.content {
  display: flex;
  flex-direction: column;
  gap: 18px;
  max-width: 760px;
  width: 100%;
}

.content[hidden] { display: none; }

/* ── Compact Overview Quotas Row ── */
.overview-quotas-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 10px;
}

.overview-quota-card {
  display: flex;
  flex-direction: column;
  gap: 6px;
  padding: 11px 13px;
  border-radius: 10px;
  background: var(--surface);
  border: 1px solid var(--border);
  box-shadow: var(--card-shadow);
  cursor: pointer;
  transition: border-color 120ms ease;
}

.overview-quota-card:hover {
  border-color: var(--border-strong);
}

.overview-quota-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
}

.overview-quota-name {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-size: 12.5px;
  font-weight: 600;
  color: var(--text);
}

.overview-quota-name img {
  width: 14px;
  height: 14px;
  border-radius: 3px;
  object-fit: contain;
}

.overview-quota-val {
  font-size: 12.5px;
  font-weight: 650;
  font-variant-numeric: tabular-nums;
  color: var(--text);
}

.overview-quota-val.is-empty {
  font-weight: 500;
  font-size: 11.5px;
  color: var(--muted);
}

.overview-quota-sub {
  font-size: 11px;
  color: var(--muted);
  display: flex;
  justify-content: space-between;
  gap: 8px;
  font-variant-numeric: tabular-nums;
}

.overview-quota-bar {
  height: 4px;
  border-radius: 999px;
  background: var(--surface-alt);
  overflow: hidden;
}

.overview-quota-fill {
  height: 100%;
  border-radius: 999px;
  background: var(--accent);
}

/* ── Quotas & Runtime Detail View ── */
.ws-quotas-panel {
  display: flex;
  flex-direction: column;
  gap: 16px;
  max-width: 760px;
  width: 100%;
}

.ws-quotas-panel[hidden] { display: none; }

.detail-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 14px 16px;
  display: flex;
  flex-direction: column;
  gap: 12px;
  box-shadow: var(--card-shadow);
}

.detail-card-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
}

.detail-card-title {
  margin: 0;
  font-size: 12.5px;
  font-weight: 650;
  color: var(--text);
}

.rail-pill-btn {
  appearance: none;
  border: 1px solid var(--border);
  background: transparent;
  color: var(--text-secondary);
  border-radius: 6px;
  padding: 3px 9px;
  font: inherit;
  font-size: 11px;
  font-weight: 550;
  cursor: pointer;
}

.rail-pill-btn:hover {
  background: var(--surface-hover);
  color: var(--text);
}

/* ── Quota Summary (preserves palette test invariants) ── */
.quota-summary {
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.quota-summary[hidden] { display: none; }

.quota-fallback-note {
  font-size: 12px;
  color: var(--muted);
  padding: 6px 0;
}

.quota-fallback-note[hidden] { display: none; }

.quota-section {
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.quota-section + .quota-section {
  padding-top: 10px;
  border-top: 1px solid var(--row-border);
}

.quota-section-titlebar {
  display: flex;
  align-items: center;
  gap: 8px;
  min-width: 0;
}

.quota-section-header {
  font-size: 12px;
  font-weight: 650;
  color: var(--text);
}

.quota-refresh-feedback {
  flex: 1 1 auto;
  min-width: 0;
  overflow: hidden;
  color: var(--muted);
  font-size: 11px;
  text-align: right;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.quota-refresh-feedback[hidden] { display: none; }
.quota-refresh-feedback.error { color: var(--interrupted); }

.quota-refresh-button {
  flex-shrink: 0;
  height: 22px;
  padding: 0 8px;
  border: 1px solid var(--border);
  border-radius: 6px;
  background: transparent;
  color: var(--muted);
  font-family: inherit;
  font-size: 11px;
  cursor: pointer;
}

.quota-group {
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.quota-group-header {
  font-size: 11px;
  font-weight: 550;
  color: var(--muted);
}

.quota-empty-hint {
  font-size: 11.5px;
  color: var(--muted);
}

.quota-group-row {
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.quota-group-header {
  font-size: 11.5px;
  font-weight: 600;
  color: var(--muted);
}

.quota-halves {
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.quota-half,
.quota-row {
  display: flex;
  flex-direction: column;
  gap: 5px;
}

.quota-row.is-stale { opacity: 0.6; }

.quota-label-row,
.quota-row-head {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 10px;
  font-size: 12px;
  line-height: 1.3;
  font-variant-numeric: tabular-nums;
}

.quota-label,
.quota-row-label {
  color: var(--text);
  font-weight: 600;
  white-space: nowrap;
}

.quota-percent,
.quota-row-value {
  color: var(--muted);
  white-space: nowrap;
  font-size: 11.5px;
  text-align: right;
}

.quota-bar-track {
  height: 5px;
  border-radius: 999px;
  background: var(--surface-alt);
  overflow: hidden;
}

.quota-bar-fill {
  height: 100%;
  border-radius: 999px;
  transition: width 0.25s ease;
  background: var(--bar-fill, var(--accent));
}

/* Provider identity palette — mirrored verbatim with src/quota-ring.html */
.quota-summary {
  --id-claude-outer: #2dd4bf;
  --id-claude-inner: #6489f7;
  --id-codex-outer: #a78bfa;
  --id-codex-inner: #22d3ee;
  --id-antigravity-outer: #38bdf8;
  --id-antigravity-inner: #6366f1;
  --id-kimi-outer: #3b93f7;
  --id-kimi-inner: #e27aeb;
  --id-deepseek-outer: #7aa0e8;
  --sev-warn: #fbbf24;
  --sev-hot: #f87171;
}

.quota-bar-fill.pv-claudeQuota.rg-outer { --bar-fill: var(--id-claude-outer); }
.quota-bar-fill.pv-claudeQuota.rg-inner { --bar-fill: var(--id-claude-inner); }
.quota-bar-fill.pv-codexQuota.rg-outer { --bar-fill: var(--id-codex-outer); }
.quota-bar-fill.pv-codexSparkQuota.rg-outer { --bar-fill: var(--id-codex-outer); }
.quota-bar-fill.pv-codexQuota.rg-inner { --bar-fill: var(--id-codex-inner); }
.quota-bar-fill.pv-codexSparkQuota.rg-inner { --bar-fill: var(--id-codex-inner); }
.quota-bar-fill.pv-antigravityQuota.rg-outer { --bar-fill: var(--id-antigravity-outer); }
.quota-bar-fill.pv-antigravityQuota.rg-inner { --bar-fill: var(--id-antigravity-inner); }
.quota-bar-fill.pv-kimiQuota.rg-outer { --bar-fill: var(--id-kimi-outer); }
.quota-bar-fill.pv-kimiQuota.rg-inner { --bar-fill: var(--id-kimi-inner); }
.quota-bar-fill.pv-deepseekQuota.rg-outer { --bar-fill: var(--id-deepseek-outer); }
.quota-bar-fill.sev-warn { --bar-fill: var(--sev-warn); }
.quota-bar-fill.sev-hot { --bar-fill: var(--sev-hot); }
.quota-bar-fill.sev-reset { opacity: 0.45; }

.quota-row-inline-empty {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding-top: 8px;
  border-top: 1px solid var(--row-border);
  font-size: 12px;
}

.quota-row-inline-empty strong {
  font-weight: 600;
  color: var(--text);
}

.quota-row-inline-empty span {
  font-size: 11.5px;
  color: var(--muted);
}

/* ── Runtime Status Rows ── */
.runtime-rows {
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.runtime-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding: 5px 0;
  font-size: 12px;
}

.runtime-row + .runtime-row {
  border-top: 1px solid var(--row-border);
}

.runtime-left {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  font-weight: 500;
  color: var(--text);
}

.runtime-left img {
  width: 15px;
  height: 15px;
  border-radius: 3px;
  object-fit: contain;
}

.status-pill {
  font-size: 11px;
  font-weight: 550;
  padding: 2px 8px;
  border-radius: 999px;
  background: var(--surface-alt);
  color: var(--muted);
  font-variant-numeric: tabular-nums;
}

.status-pill.is-ready {
  background: var(--running-soft);
  color: var(--running);
}

/* ── Pending Approvals ── */
.approvals-panel {
  padding: 12px 14px;
  border-radius: 10px;
  border: 1px solid color-mix(in srgb, var(--interrupted) 38%, var(--border));
  background: color-mix(in srgb, var(--interrupted) 7%, var(--surface));
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.approvals-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
}

.approvals-title {
  font-size: 12px;
  font-weight: 650;
  color: var(--interrupted);
}

.approval-item {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding: 8px 10px;
  border-radius: 8px;
  background: var(--surface);
  border: 1px solid var(--border);
}

.approval-item-main {
  min-width: 0;
  display: flex;
  flex-direction: column;
  gap: 2px;
}

.approval-item-top {
  font-size: 12px;
  font-weight: 600;
  color: var(--text);
  display: flex;
  align-items: center;
  gap: 6px;
}

.approval-tool-tag {
  font-size: 10px;
  font-weight: 650;
  text-transform: uppercase;
  padding: 1px 5px;
  border-radius: 4px;
  background: var(--interrupted-soft);
  color: var(--interrupted);
}

.approval-item-cmd {
  font-size: 11.5px;
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  color: var(--muted);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

/* ── Section Groups & Session Cards ── */
.group {
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.group-title {
  margin: 0;
  font-size: 11px;
  font-weight: 650;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  color: var(--subtle);
}

.cards {
  display: flex;
  flex-direction: column;
  gap: 7px;
}

.card {
  position: relative;
  display: grid;
  grid-template-columns: 28px minmax(0, 1fr) auto;
  gap: 11px;
  align-items: center;
  padding: 10px 13px;
  border-radius: 10px;
  background: var(--surface);
  border: 1px solid var(--border);
  box-shadow: var(--card-shadow);
  transition: border-color 120ms ease;
}

.card:hover { border-color: var(--border-strong); }
.card-unfocusable { opacity: 0.88; }

.card-quick-numbered {
  grid-template-columns: 22px 28px minmax(0, 1fr) auto;
}

.quick-digit-badge {
  width: 20px;
  height: 20px;
  border-radius: 5px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  background: var(--accent);
  color: #ffffff;
  font-size: 11px;
  font-weight: 700;
  font-variant-numeric: tabular-nums;
}

.content:not(.is-quick-capture) .quick-digit-badge { opacity: 0; }

.card-quick-tombstone { opacity: 0.52; }

.quick-tombstone-body {
  grid-column: 2 / -1;
  min-width: 0;
  display: flex;
  flex-direction: column;
  gap: 2px;
}

.quick-tombstone-title {
  font-size: 13px;
  font-weight: 600;
  text-decoration: line-through;
  color: var(--muted);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.quick-tombstone-meta {
  font-size: 11px;
  color: var(--subtle);
}

.session-id-badge {
  position: absolute;
  top: 7px;
  right: 30px;
  font-size: 10px;
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  color: var(--subtle);
}

.hide-session-button {
  position: absolute;
  top: 5px;
  right: 7px;
  width: 20px;
  height: 20px;
  min-width: 20px;
  padding: 0;
  border: 0;
  border-radius: 5px;
  background: transparent;
  color: var(--subtle);
  font-size: 13px;
  line-height: 1;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
}

.hide-session-button:hover:not(:disabled) {
  background: var(--surface-hover);
  color: var(--text);
}

.agent-icon {
  width: 28px;
  height: 28px;
  border-radius: 7px;
  object-fit: contain;
  background: var(--surface-alt);
  padding: 3px;
}

.agent-fallback {
  width: 28px;
  height: 28px;
  border-radius: 7px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  background: var(--surface-alt);
  color: var(--muted);
  font-size: 10.5px;
  font-weight: 700;
}

.main {
  min-width: 0;
  display: flex;
  flex-direction: column;
  gap: 3px;
}

.session-title {
  font-size: 13px;
  font-weight: 600;
  line-height: 1.3;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  cursor: text;
  padding-right: 54px;
}

.session-title-input {
  width: calc(100% - 54px);
  padding: 2px 6px;
  border: 1px solid var(--accent);
  border-radius: 5px;
  background: var(--surface);
  color: var(--text);
  font: inherit;
  font-size: 13px;
  font-weight: 600;
  outline: none;
}

.meta {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 5px;
  font-size: 11px;
  color: var(--muted);
}

.badge {
  display: inline-flex;
  align-items: center;
  padding: 1px 6px;
  border-radius: 999px;
  font-size: 10.5px;
  font-weight: 600;
}

.badge-running { background: var(--running-soft); color: var(--running); }
.badge-done { background: var(--done-soft); color: var(--done); }
.badge-interrupted { background: var(--interrupted-soft); color: var(--interrupted); }
.badge-idle { background: var(--idle-soft); color: var(--idle); }

.source-badge {
  display: inline-flex;
  align-items: center;
  padding: 1px 6px;
  border-radius: 999px;
  font-size: 10px;
  font-weight: 500;
  background: var(--surface-alt);
  color: var(--muted);
}

.path,
.model-row,
.event-row,
.plan-progress-row,
.context-usage-row {
  font-size: 11px;
  color: var(--muted);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.plan-progress-row {
  white-space: normal;
  overflow-wrap: anywhere;
  color: var(--text-secondary);
}

.event-row { color: var(--text-secondary); }

.session-automation-row {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 6px;
  margin-top: 3px;
}

.session-automation-label {
  font-size: 10.5px;
  font-weight: 600;
  color: var(--muted);
}

.session-automation-select {
  min-width: 144px;
  max-width: 210px;
}

.session-automation-select .language-picker-trigger {
  height: 24px;
  padding: 0 24px 0 8px;
  font-size: 11px;
  border-radius: 6px;
}

.session-automation-select .language-picker-option {
  padding: 6px 8px;
  font-size: 11px;
}

.session-automation-unavailable {
  font-size: 10.5px;
  color: var(--subtle);
}

.session-automation-note {
  margin: 0;
  font-size: 10.5px;
  color: var(--subtle);
}

.actions {
  display: flex;
  flex-direction: column;
  align-items: flex-end;
  gap: 5px;
  flex-shrink: 0;
  padding-top: 14px;
}

button {
  appearance: none;
  border: 0;
  border-radius: 7px;
  height: 27px;
  min-width: 72px;
  padding: 0 11px;
  background: var(--accent);
  color: #ffffff;
  font: inherit;
  font-size: 11.5px;
  font-weight: 550;
  cursor: pointer;
  transition: background 120ms ease, opacity 120ms ease;
}

button:hover:not(:disabled) { background: var(--accent-hover); }
button:disabled { opacity: 0.42; cursor: default; }

.secondary-btn,
.open-folder-button,
.open-terminal-button,
.mark-read-button,
.session-history-resume,
.session-automation-revoke {
  background: var(--surface-alt);
  color: var(--text);
  border: 1px solid var(--border);
}

.secondary-btn:hover:not(:disabled),
.open-folder-button:hover:not(:disabled),
.open-terminal-button:hover:not(:disabled),
.mark-read-button:hover:not(:disabled),
.session-history-resume:hover:not(:disabled),
.session-automation-revoke:hover:not(:disabled) {
  background: var(--surface-hover);
  border-color: var(--border-strong);
}

.focus-unavailable-reason,
.session-action-feedback {
  max-width: 148px;
  font-size: 10.5px;
  line-height: 1.3;
  color: var(--muted);
  text-align: right;
}

/* ── Projects Directory Cards ── */
.project-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
  gap: 8px;
}

.project-card {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding: 10px 12px;
  border-radius: 10px;
  background: var(--surface);
  border: 1px solid var(--border);
  box-shadow: var(--card-shadow);
}

.project-main {
  min-width: 0;
  display: flex;
  flex-direction: column;
  gap: 2px;
}

.project-name {
  font-size: 12.5px;
  font-weight: 600;
  color: var(--text);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.project-path {
  font-size: 11px;
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  color: var(--muted);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.project-meta {
  font-size: 10.5px;
  color: var(--subtle);
}

.project-actions {
  display: flex;
  align-items: center;
  gap: 5px;
  flex-shrink: 0;
}

.project-actions button {
  height: 25px;
  min-width: 0;
  padding: 0 9px;
  font-size: 11px;
}

/* ── Session History ── */
.session-history-hint {
  margin: 0;
  font-size: 11.5px;
  color: var(--muted);
}

.session-history-cards {
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.session-history-card {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding: 9px 12px;
  border-radius: 9px;
  background: var(--surface);
  border: 1px solid var(--border);
}

.session-history-main {
  min-width: 0;
  display: flex;
  flex-direction: column;
  gap: 2px;
}

.session-history-title {
  font-size: 12.5px;
  font-weight: 550;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.session-history-meta {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 5px;
  font-size: 11px;
  color: var(--muted);
}

.session-history-flag {
  font-size: 10px;
  font-weight: 600;
  padding: 1px 5px;
  border-radius: 4px;
  background: var(--interrupted-soft);
  color: var(--interrupted);
}

.session-history-actions {
  display: flex;
  flex-direction: column;
  align-items: flex-end;
  gap: 3px;
  flex-shrink: 0;
}

.session-history-resume {
  height: 25px;
  min-width: 64px;
  padding: 0 10px;
  font-size: 11px;
}

.session-history-status {
  font-size: 10.5px;
  color: var(--muted);
}

.session-history-toggle {
  align-self: flex-start;
  height: 26px;
  min-width: 0;
  padding: 0 10px;
  background: transparent;
  color: var(--accent);
  font-size: 11.5px;
}

.session-history-toggle:hover:not(:disabled) {
  background: var(--accent-soft);
}

.orphan-card {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding: 9px 12px;
  border-radius: 9px;
  background: var(--surface);
  border: 1px solid var(--border);
}

.orphan-main { min-width: 0; }
.orphan-title { font-size: 12.5px; font-weight: 600; }
.orphan-meta { font-size: 11px; color: var(--muted); }

/* ── Empty State ── */
.empty {
  padding: 28px 16px;
  text-align: center;
  color: var(--muted);
  border-radius: 10px;
  border: 1px dashed var(--border-strong);
}

.empty-title {
  margin: 0 0 4px;
  font-size: 13px;
  font-weight: 600;
  color: var(--text);
}

.empty-body {
  margin: 0;
  font-size: 12px;
  color: var(--muted);
}

.hidden { display: none !important; }

@media (max-width: 640px) {
  .app { grid-template-columns: 148px minmax(0, 1fr); }
  .ws-scroll { padding: 14px 16px 20px; }
  .overview-quotas-grid { grid-template-columns: 1fr; }
}
</style>
</head>
<body>
  <div id="wsBody" class="app" data-view="overview">
    <aside class="ws-sidebar" aria-label="Workspace navigation">
      <div class="ws-sidebar-top">
        <div class="title-row">
          <div class="title-row-left">
            <span id="wsStatusDot" class="brand-mark" aria-hidden="true"></span>
            <h1 id="title">Workspace</h1>
          </div>
          <span id="count" class="count"></span>
        </div>

        <nav id="wsNav" class="ws-nav">
          <button type="button" class="ws-nav-btn is-active" data-ws-view="overview">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <rect x="3.5" y="3.5" width="7" height="7" rx="1.5"></rect>
              <rect x="13.5" y="3.5" width="7" height="7" rx="1.5"></rect>
              <rect x="3.5" y="13.5" width="7" height="7" rx="1.5"></rect>
              <rect x="13.5" y="13.5" width="7" height="7" rx="1.5"></rect>
            </svg>
            <span data-ws-nav-label="overview">Overview</span>
          </button>
          <button type="button" class="ws-nav-btn" data-ws-view="sessions">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <rect x="3" y="4" width="18" height="5" rx="1.5"></rect>
              <rect x="3" y="11" width="18" height="5" rx="1.5"></rect>
              <path d="M3 20h12"></path>
            </svg>
            <span data-ws-nav-label="sessions">Sessions</span>
          </button>
          <button type="button" class="ws-nav-btn" data-ws-view="projects">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M3 6.5A2.5 2.5 0 0 1 5.5 4h3.9a2 2 0 0 1 1.6.8l1.2 1.6a1 1 0 0 0 .8.4h5.5A2.5 2.5 0 0 1 21 9.3v8.2a2.5 2.5 0 0 1-2.5 2.5h-13A2.5 2.5 0 0 1 3 17.5v-11Z"></path>
            </svg>
            <span data-ws-nav-label="projects">Projects</span>
          </button>
          <button type="button" class="ws-nav-btn" data-ws-view="quotas">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <circle cx="12" cy="12" r="8.5"></circle>
              <path d="M12 3.5A8.5 8.5 0 0 1 20.5 12"></path>
            </svg>
            <span data-ws-nav-label="quotas">Quotas</span>
          </button>
        </nav>
      </div>

      <div class="ws-sidebar-footer">
        <button id="wsBtnCommand" type="button" class="ws-side-action">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="m7 9 4 3-4 3"></path><path d="M13 15h4"></path><rect x="3" y="4" width="18" height="16" rx="3"></rect>
          </svg>
          <span id="wsLblCommand">Command</span>
        </button>
        <button id="wsBtnCodex" type="button" class="ws-side-action">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <polyline points="16 18 22 12 16 6"></polyline><polyline points="8 6 2 12 8 18"></polyline>
          </svg>
          <span>Codex</span>
        </button>
        <button id="wsBtnAntigravity" type="button" class="ws-side-action">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M12 3 4 20h4.2l3.8-8.2L15.8 20H20L12 3Z"></path>
          </svg>
          <span>Antigravity</span>
        </button>
        <button id="wsBtnSettings" type="button" class="ws-side-action">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="12" r="3"></circle>
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1Z"></path>
          </svg>
          <span id="wsLblSettings">Settings</span>
        </button>
      </div>
    </aside>

    <div class="ws-main">
      <div id="quickBanner" class="quick-banner" role="status" aria-live="polite" hidden></div>
      <div class="ws-scroll">
        <main id="content" class="content" aria-live="polite" data-language-picker-boundary></main>

        <section id="wsQuotasPanel" class="ws-quotas-panel" hidden>
          <div class="detail-card">
            <div class="detail-card-head">
              <h2 id="wsQuotaTitle" class="detail-card-title">Quotas</h2>
              <button id="wsReadGeminiQuota" type="button" class="rail-pill-btn" hidden></button>
            </div>
            <div id="wsGeminiQuotaStatus" class="quota-fallback-note" role="status" hidden></div>
            <div id="quotaSummary" class="quota-summary" hidden></div>
            <div id="wsQuotaMissingRows"></div>
            <div id="wsQuotaFallback" class="quota-fallback-note" hidden></div>
          </div>

          <div class="detail-card">
            <div class="detail-card-head">
              <h2 id="wsRuntimeTitle" class="detail-card-title">Connections</h2>
              <button id="wsBtnManageAgents" type="button" class="rail-pill-btn">Manage</button>
            </div>
            <div id="wsRuntimeList" class="runtime-rows"></div>
          </div>
        </section>
      </div>
    </div>
  </div>
  <script src="./session-focus-unavailable.js"></script>
  <script src="./language-picker.js"></script>
  <script src="./quota-balance.js"></script>
  <script src="./dashboard-renderer.js"></script>
</body>
</html>
