<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'self' 'unsafe-inline'; script-src 'self'; img-src 'self' data: file:">
<title>Character OS Workspace</title>
<link rel="stylesheet" href="ui-tokens.css">
<link rel="stylesheet" href="language-picker.css">
<link rel="stylesheet" href="dashboard.css">
</head>
<body>
  <div id="wsBody" class="app" data-view="overview">
    <aside class="side" aria-label="Workspace navigation">
      <div class="side-drag"></div>
      <nav id="wsNav" class="nav">
        <button type="button" class="nav-btn is-active" data-ws-view="overview">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="3.5" width="7" height="7" rx="1.6"/><rect x="13.5" y="3.5" width="7" height="7" rx="1.6"/><rect x="3.5" y="13.5" width="7" height="7" rx="1.6"/><rect x="13.5" y="13.5" width="7" height="7" rx="1.6"/></svg>
          <span data-ws-nav-label="overview">Overview</span>
        </button>
        <button type="button" class="nav-btn" data-ws-view="sessions">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h10"/></svg>
          <span data-ws-nav-label="sessions">Sessions</span>
          <em class="nav-count" data-ws-count="sessions" hidden></em>
        </button>
        <button type="button" class="nav-btn" data-ws-view="projects">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6.5A2.5 2.5 0 0 1 5.5 4h3.9a2 2 0 0 1 1.6.8l1.2 1.6a1 1 0 0 0 .8.4h5.5A2.5 2.5 0 0 1 21 9.3v8.2a2.5 2.5 0 0 1-2.5 2.5h-13A2.5 2.5 0 0 1 3 17.5v-11Z"/></svg>
          <span data-ws-nav-label="projects">Projects</span>
        </button>
        <button type="button" class="nav-btn" data-ws-view="quotas">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg>
          <span data-ws-nav-label="quotas">Quotas</span>
        </button>
      </nav>

      <div class="side-foot">
        <button id="wsBtnCodex" type="button" class="foot-btn">
          <img id="wsIcoCodex" alt="" hidden>
          <svg id="wsSvgCodex" viewBox="0 0 24 24" aria-hidden="true"><polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/></svg>
          <span>Codex</span>
        </button>
        <button id="wsBtnAntigravity" type="button" class="foot-btn">
          <img id="wsIcoAntigravity" alt="" hidden>
          <svg id="wsSvgAntigravity" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3 4 20h4.2l3.8-8.2L15.8 20H20L12 3Z"/></svg>
          <span>Antigravity</span>
        </button>
        <button id="wsBtnSettings" type="button" class="foot-btn">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1Z"/></svg>
          <span id="wsLblSettings">Settings</span>
        </button>
      </div>
    </aside>

    <section class="main">
      <header class="top">
        <h1 id="title">Workspace</h1>
        <span id="wsStatusDot" class="ui-dot" aria-hidden="true" hidden></span>
        <span id="count" class="count"></span>
      </header>
      <div id="quickBanner" class="quick-banner" role="status" aria-live="polite" hidden></div>
      <div class="scroll">
        <main id="content" class="content" aria-live="polite" data-language-picker-boundary></main>

        <section id="wsQuotasPanel" class="quotas-panel" hidden>
          <div class="qp-col">
            <div class="block-head">
              <h2 id="wsQuotaTitle" class="block-title">Quotas</h2>
              <button id="wsReadGeminiQuota" type="button" class="ui-btn" hidden></button>
            </div>
            <div id="wsGeminiQuotaStatus" class="note" role="status" hidden></div>
            <div id="quotaSummary" class="quota-summary" hidden></div>
            <div id="wsQuotaMissingRows"></div>
            <div id="wsQuotaFallback" class="note" hidden></div>
          </div>
          <div class="qp-col qp-side">
            <div class="block-head">
              <h2 id="wsRuntimeTitle" class="block-title">Connections</h2>
              <button id="wsBtnManageAgents" type="button" class="ui-btn quiet">Manage</button>
            </div>
            <div id="wsRuntimeList" class="runtime-rows"></div>
          </div>
        </section>
      </div>
    </section>
  </div>
  <script src="./ui-platform.js"></script>
  <script src="./session-focus-unavailable.js"></script>
  <script src="./language-picker.js"></script>
  <script src="./quota-balance.js"></script>
  <script src="./dashboard-renderer.js"></script>
</body>
</html>
